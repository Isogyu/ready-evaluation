[project]
name = "ready-eval"
version = "0.1.0"
description = "READY論文の考え方に基づく、BANKING77でのレビュー振り分け予備実験"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.0",
  "openai>=1.40",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "pyyaml>=6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
